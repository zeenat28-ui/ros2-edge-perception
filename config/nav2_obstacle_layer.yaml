# ==============================================================================
# Nav2 Local Costmap Integration: ros2_edge_perception Obstacle & Safety Layer
# ==============================================================================
# Demonstrates direct integration of tracked 3D obstacles and supervisory safety
# requests into the Nav2 navigation stack.
#
# Dataflow:
#   PerceptionNode -> /perception/detections_3d -> Nav2 Local Costmap (Obstacle Layer)
#                  -> /perception/safety_alert  -> Robot Safety Supervisor / Throttler
#                  -> /perception/trajectories  -> Nav2 Controller (Dynamic Obstacle Avoidance)
# ==============================================================================

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_roll_pitch: false
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.45
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: perception_scan
        perception_scan:
          topic: /perception/detections_3d
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          obstacle_max_range: 8.0
          obstacle_min_range: 0.2
          raytrace_max_range: 9.0
          raytrace_min_range: 0.2
          clearing: True
          marking: True
          data_type: "PointCloud2"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.75

# ------------------------------------------------------------------------------
# Supervisory Safety Throttler Node Parameters
# ------------------------------------------------------------------------------
# Listens to /perception/safety_alert (SafetyRequest JSON) and throttles /cmd_vel
safety_throttler:
  ros__parameters:
    safety_topic: "/perception/safety_alert"
    cmd_vel_in_topic: "/cmd_vel_nav2"
    cmd_vel_out_topic: "/cmd_vel"
    max_safe_speed_m_s: 1.5
    degraded_speed_m_s: 0.5
    stop_deceleration_limit_m_s2: 2.0
    timeout_recovery_seconds: 2.0
